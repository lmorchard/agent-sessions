[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sessions"
version = "0.1.0"
description = "Autonomous agent session board driver and reconciliation loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pygithub>=2.9.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[project.scripts]
agent-session-driver = "agent_sessions.driver.agent_session_driver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sessions"]

[tool.pytest.ini_options]
testpaths = ["driver", "scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["docs/dev-sessions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"driver/*.py" = ["E402", "F403"]
"scripts/*.py" = ["E402", "F403"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
