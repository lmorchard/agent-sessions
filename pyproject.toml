[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sessions"
version = "0.1.0"
description = "Autonomous agent session board driver and reconciliation loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[project.scripts]
agent-session-driver = "agent_sessions.driver.agent_session_driver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sessions"]

[tool.pytest.ini_options]
# `tests`, not `driver`/`scripts`. Those held the suites until #257 and #258 relocated
# them, and this line did not move with them -- so a bare `pytest` collected nothing
# and exited 0, reporting a clean run having verified nothing. `make gate-test` passes
# explicit paths, which is why CI stayed honest and only the default was a false green.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# The suites bootstrap `src` onto sys.path by hand in 24 files. Declaring it once here
# is what lets those be deleted.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Both frozen trees, matching `docs_check.FROZEN`. Session artifacts are a historical
# record, not maintained code -- some carry deliberately rough probe scripts. Archiving
# a session used to move it out from under this exclude and into the linter.
exclude = ["docs/dev-sessions", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
